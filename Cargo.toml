[package]
name = "promptpack"
version = "0.1.0"
edition = "2021"
authors = ["PromptCreator Contributors"]
description = "A programmatic tool for turning one-shot ideas into Codex long-horizon prompt packs"
license = "MIT"

[[bin]]
name = "promptpack"
path = "src/main.rs"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.11", features = ["json", "blocking"], optional = true }
tokio = { version = "1.0", features = ["full"], optional = true }
slug = "0.1"
dialoguer = "0.11"

[dev-dependencies]
tempfile = "3.8"
assert_fs = "1.0"

[features]
default = []
llm = ["reqwest", "tokio"]
